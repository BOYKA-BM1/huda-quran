# يبني ملف APK تلقائيًا بدون Android Studio على جهازك
# ارفع المشروع على GitHub → Actions → Build APK → Download artifact
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        run: npm ci || npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
            node scripts/patch-android.js || true
          fi

      - name: Sync web → android
        run: |
          npx cap sync android
          node scripts/patch-android.js || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huda-quran-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
